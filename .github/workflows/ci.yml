name: CI

# Tests and type-checks on every push to main and every pull request. Publishes nothing —
# image builds stay manual (docker-build.yml) on purpose.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (OpenSSL for reqwest)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web-ui:
    name: Web UI build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/web-ui/package-lock.json
      - run: npm ci
      - run: npm run build
