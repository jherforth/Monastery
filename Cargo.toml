[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-api",
    "crates/harness-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["HomeLab AI Harness Team"]
repository = "https://github.com/homelab-ai-harness/harness"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-macros = "0.4"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# LLM client (OpenAI-compatible)
async-openai = "0.28"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Config
dotenvy = "0.15"
config = "0.14"

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Encoding
base64 = "0.22"

# Futures
futures = "0.3"

# mDNS discovery
mdns-sd = "0.13"

# HTTP types
http = "1.0"

# Secrets (match async-openai's version)
secrecy = "0.10"

# Workspace crates
harness-core = { path = "crates/harness-core" }
harness-agent = { path = "crates/harness-agent" }
