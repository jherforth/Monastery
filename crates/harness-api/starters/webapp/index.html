<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Tasks</h1>
      <p class="hint">Saved in this browser — nothing leaves your device.</p>
    </header>

    <form id="new-task" class="new-task" autocomplete="off">
      <label class="visually-hidden" for="task-input">New task</label>
      <input id="task-input" name="title" placeholder="What needs doing?" required maxlength="200">
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="summary">
      <span id="count"></span>
      <button type="button" id="clear-done" class="link">Clear completed</button>
    </footer>
  </main>

  <template id="task-template">
    <li class="task">
      <label>
        <input type="checkbox" class="task__toggle">
        <span class="task__title"></span>
      </label>
      <button type="button" class="task__delete" aria-label="Delete task">✕</button>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
