<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Riverbend Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Riverbend Studio</a>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="page">
    <h1>Get in touch</h1>
    <p>Tell us a little about your project and we'll reply within two working days.</p>
    <!-- No server here: the form opens the visitor's mail app. Swap the action for a form
         service or a backend endpoint when you have one. -->
    <form class="contact-form" action="mailto:hello@example.com" method="post" enctype="text/plain">
      <label>Name <input name="name" autocomplete="name" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Message <textarea name="message" rows="5" required></textarea></label>
      <button class="button" type="submit">Send</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>Riverbend Studio · 12 Mill Road</p>
  </footer>
</body>
</html>
